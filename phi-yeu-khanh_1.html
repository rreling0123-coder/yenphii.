<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phi có iu Khánh không?</title>
<style>
  :root{
    --bg1:#ffe6f0;
    --bg2:#f3e6ff;
    --bg3:#e6f0ff;
    --text:#8a3b6b;
    --btn-yes:#ff6f9c;
    --btn-yes-dark:#e0507f;
    --btn-no:#c9a0ff;
    --btn-no-dark:#a875e6;
    --card-bg:rgba(255,255,255,0.75);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    box-sizing:border-box;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg1:#3a2340;
      --bg2:#2b1f45;
      --bg3:#20263f;
      --text:#ffd6ec;
      --card-bg:rgba(40,25,50,0.75);
    }
  }
  :root[data-theme="dark"]{
    --bg1:#3a2340;
    --bg2:#2b1f45;
    --bg3:#20263f;
    --text:#ffd6ec;
    --card-bg:rgba(40,25,50,0.75);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100%;
    height:100%;
    background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
    background-size:300% 300%;
    animation:bgMove 12s ease infinite;
    font-family:'Segoe UI', 'Comic Sans MS', sans-serif;
    overflow-x:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  @keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }
  .stage{
    position:relative;
    width:100%;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    z-index:2;
  }
  .card{
    background:var(--card-bg);
    backdrop-filter:blur(6px);
    border-radius:28px;
    padding:36px 24px;
    box-shadow:0 10px 30px rgba(150,80,150,0.25);
    max-width:480px;
    width:100%;
  }
  h1{
    color:var(--text);
    font-size:clamp(1.4rem, 5vw, 2.2rem);
    margin:0 0 26px;
    line-height:1.4;
    text-shadow:1px 1px 6px rgba(255,255,255,0.6);
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.04);}
  }
  .buttons{
    display:flex;
    gap:18px;
    justify-content:center;
    flex-wrap:wrap;
  }
  button{
    border:none;
    border-radius:999px;
    padding:14px 30px;
    font-size:1.05rem;
    font-weight:bold;
    cursor:pointer;
    color:#fff;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow:0 6px 14px rgba(0,0,0,0.15);
  }
  #btnYes{ background:linear-gradient(135deg,var(--btn-yes),var(--btn-yes-dark)); }
  #btnNo{ background:linear-gradient(135deg,var(--btn-no),var(--btn-no-dark)); }
  button:hover{ transform:translateY(-3px) scale(1.05); }
  button:active{ transform:scale(0.92); }

  .no-text{
    margin-top:16px;
    color:var(--text);
    font-size:0.95rem;
    opacity:0;
    animation:fadeIn 0.5s ease forwards;
  }
  @keyframes fadeIn{ to{opacity:1;} }

  .photo-gallery{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:22px;
  }
  .photo-gallery img{
    width:90px;
    height:90px;
    object-fit:cover;
    border-radius:16px;
    border:3px solid #fff;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
    opacity:0;
    animation:popIn 0.6s ease forwards;
  }
  .photo-gallery img:nth-child(1){animation-delay:0.1s;}
  .photo-gallery img:nth-child(2){animation-delay:0.3s;}
  .photo-gallery img:nth-child(3){animation-delay:0.5s;}
  @keyframes popIn{
    from{opacity:0; transform:scale(0.5) rotate(-8deg);}
    to{opacity:1; transform:scale(1) rotate(0deg);}
  }

  /* Falling emojis (background layer) */
  .falling{
    position:fixed;
    top:-10%;
    font-size:1.6rem;
    pointer-events:none;
    z-index:1;
    animation-name:fall;
    animation-timing-function:linear;
    animation-iteration-count:1;
  }
  @keyframes fall{
    from{ transform:translateY(0) rotate(0deg); opacity:1; }
    to{ transform:translateY(115vh) rotate(360deg); opacity:0.9; }
  }

  /* Floating photo bubbles */
  .floating-photo{
    position:fixed;
    top:-15%;
    width:80px;
    height:80px;
    border-radius:14px;
    object-fit:cover;
    border:3px solid #fff;
    box-shadow:0 6px 16px rgba(0,0,0,0.2);
    pointer-events:none;
    z-index:1;
    animation-name:floatDown;
    animation-timing-function:ease-in;
    animation-iteration-count:1;
  }
  @keyframes floatDown{
    from{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0.95; }
    to{ transform:translateY(120vh) translateX(var(--drift,0px)) rotate(180deg); opacity:0.8; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="card">
    <h1>PHI CÓ IU KHÁNH KHÔNG🌷🌷</h1>
    <div class="buttons">
      <button id="btnYes">Có ❤️</button>
      <button id="btnNo">Không 💔</button>
    </div>
    <div id="noText" class="no-text" style="display:none;">Không được chọn đâu nha 😭🌷</div>
    <div id="gallery" class="photo-gallery"></div>
  </div>
</div>

  const images = [IMAGE_1_URL, IMAGE_2_URL, IMAGE_3_URL];

  const btnYes = document.getElementById('btnYes');
  const btnNo = document.getElementById('btnNo');
  const noText = document.getElementById('noText');
  const gallery = document.getElementById('gallery');

  let yesActivated = false;
  let fallingInterval = null;
  let photoInterval = null;

  const emojis = ['🌷', '❤️', '💗', '🌸'];

  function spawnEmoji(){
    const el = document.createElement('div');
    el.className = 'falling';
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    el.style.left = Math.random()*100 + 'vw';
    const duration = 4 + Math.random()*3;
    el.style.animationDuration = duration + 's';
    el.style.fontSize = (1.2 + Math.random()*1.2) + 'rem';
    document.body.appendChild(el);
    setTimeout(()=> el.remove(), duration*1000 + 200);
  }

  function spawnPhoto(){
    const src = images[Math.floor(Math.random()*images.length)];
    const img = document.createElement('img');
    img.className = 'floating-photo';
    img.src = src;
    img.alt = 'ảnh kỷ niệm';
    img.style.left = (5 + Math.random()*80) + 'vw';
    img.style.setProperty('--drift', (Math.random()*160 - 80) + 'px');
    const duration = 7 + Math.random()*3;
    img.style.animationDuration = duration + 's';
    document.body.appendChild(img);
    setTimeout(()=> img.remove(), duration*1000 + 200);
  }

  function startYesEffects(){
    if (yesActivated) return;
    yesActivated = true;

    // hoa/tim rơi liên tục
    fallingInterval = setInterval(spawnEmoji, 250);

    // ảnh bay liên tục, vị trí ngẫu nhiên
    photoInterval = setInterval(spawnPhoto, 1200);

    // hiện 3 ảnh cố định trong card luôn
    gallery.innerHTML = '';
    images.forEach(src=>{
      const img = document.createElement('img');
      img.src = src;
      img.alt = 'ảnh kỷ niệm';
      gallery.appendChild(img);
    });
  }

  btnYes.addEventListener('click', startYesEffects);

  btnNo.addEventListener('click', ()=>{
    btnNo.style.display = 'none';
    noText.style.display = 'block';
  });
</script>
